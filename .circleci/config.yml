version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.20  # versão estável do Node LTS
    working_directory: ~/repo

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            npm ci

      - run:
          name: Build frontend
          command: |
            npm run build

      - run:
          name: Run tests
          command: |
            npm test

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
